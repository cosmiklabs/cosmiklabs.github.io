name: Review website drafts
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run check
        env:
          SITE_URL: https://cosmiklabs.org
      - name: Install isolated browser test driver
        run: npm install --prefix "$RUNNER_TEMP/browser-qa" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Check desktop, mobile and motion behavior
        run: node scripts/check-browser.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/browser-qa/node_modules/playwright-core
          BROWSER_PATH: /usr/bin/google-chrome
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-review-screenshots
          path: review-screenshots/
          if-no-files-found: warn
          retention-days: 14
